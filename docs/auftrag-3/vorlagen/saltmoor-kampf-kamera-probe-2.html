<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saltmoor Kampf Kamera-Probe 2</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=IM+Fell+English:ital@0;1&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>:root{--paper:#efe4c8;--messing:#c8a24a;--rot:#c23a2e;--bg:#0b0907}
*{box-sizing:border-box}
body{margin:0;background:#15110d;color:var(--paper);font-family:'IM Fell English',Georgia,serif}
header{padding:18px 24px 8px;max-width:1440px;margin:0 auto}
h1{font-family:Cinzel,serif;font-size:26px;margin:0 0 6px;letter-spacing:.06em}
header p{margin:0 0 12px;max-width:900px;opacity:.85;font-size:17px;line-height:1.35}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{font-family:Cinzel,serif;font-size:14px;background:#0b0907;color:var(--paper);border:1px solid #4a3b22;padding:8px 14px;cursor:pointer}
nav button.on{border-color:var(--messing);background:#2a2114;color:#fff}
main{max-width:1440px;margin:0 auto;padding:10px 24px 40px}
.wrap{position:relative;width:100%;overflow:hidden}
.stage{position:absolute;left:0;top:0;width:1440px;height:1086px;transform-origin:0 0;background:#000}
.v{position:absolute;inset:0;display:none;overflow:hidden}
.scene{position:absolute;left:0;top:0;width:1440px;height:810px;image-rendering:pixelated}
.full{width:1440px;height:1086px}
.notes{margin-top:18px;max-width:980px}
.notes h2{font-family:Cinzel,serif;font-size:20px;margin:0 0 8px}
.notes li{font-size:17px;line-height:1.4;margin-bottom:4px}
.frage{font-style:italic;opacity:.85;font-size:17px}
.n{display:none}
.pi{width:22px;height:22px;image-rendering:pixelated;shape-rendering:crispEdges;vertical-align:middle}
.gly{image-rendering:pixelated;vertical-align:middle}

/* Kopf */
.kopf{position:absolute;left:24px;top:18px;font-family:Cinzel,serif;font-size:26px;letter-spacing:.08em;text-shadow:0 2px 0 #000}
.kopf small{display:block;font-family:'IM Fell English';font-style:italic;font-size:17px;letter-spacing:0;opacity:.8}
.geld{position:absolute;right:24px;top:18px;display:flex;align-items:center;gap:8px;background:rgba(8,6,4,.78);border:1px solid #5a4626;padding:8px 14px}
.geld .pi{width:30px;height:30px}
.geld b{font-family:Cinzel,serif;font-size:28px;color:#e8c547}
.geld span{font-size:17px;opacity:.8}
.geld i{margin-left:12px;padding-left:12px;border-left:1px solid #5a4626;font-size:16px;opacity:.75}

/* Gegner */
.fplate{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:170px}
.intent{display:flex;align-items:center;gap:4px;font-family:Cinzel,serif;font-weight:700;font-size:28px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000}
.intent .pi{width:28px;height:28px}
.intent.free{position:absolute;transform:translateX(-50%)}
.fn{font-family:Cinzel,serif;font-size:14px;letter-spacing:.1em;color:#e7d3a8;text-shadow:0 1px 0 #000}
.fbar{position:relative;width:170px;height:14px;background:#2a0c09;border:1px solid #000;box-shadow:0 0 0 1px #5a2a20}
.fbar div{height:100%;background:linear-gradient(#d4473a,#a3271d)}
.fbar span{position:absolute;inset:0;text-align:center;font-size:12px;line-height:14px;color:#fff;text-shadow:0 1px 0 #000}
.fplate.feet{min-width:160px}

/* Band unten */
.band{position:absolute;left:0;top:810px;width:1440px;height:276px;background:#000;border-top:1px solid #2a2114}
.hand{position:absolute;left:300px;right:260px;top:60px;display:flex;justify-content:center;gap:10px}
.band.B .hand{left:320px}
.band.C .hand{top:40px}
.karte{position:relative;width:162px;height:212px;background:#060504;border:1px solid var(--messing);box-shadow:inset 0 0 0 3px #060504,inset 0 0 0 4px #3a2c18,3px 4px 0 #000;transform:rotate(var(--r));display:flex;flex-direction:column;align-items:center;padding:24px 10px 10px}
.karte.lift{transform:translateY(-20px) rotate(0deg) scale(1.03);z-index:3}
.karte.rx{border-color:var(--c);box-shadow:inset 0 0 0 3px #060504,inset 0 0 0 4px var(--c),0 0 22px -2px var(--c),3px 4px 0 #000}
.kost{position:absolute;left:-12px;top:-12px;width:38px;height:38px;background:#0b0907;border:2px solid var(--paper);transform:rotate(45deg);display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-weight:700;font-size:18px}

.kst{position:absolute;right:8px;top:8px}
.kn{font-family:Cinzel,serif;font-weight:700;font-size:14px;letter-spacing:.06em;margin-top:2px;text-align:center}
.bogen{width:92px;height:80px;margin:10px 0 12px;border-radius:46px 46px 4px 4px;background:#14110c;border:1px solid #3a2c18;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bogen img{width:72px;height:72px;image-rendering:pixelated;object-fit:contain}
.kt{font-size:15px;text-align:center;line-height:1.2}
.rib{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:#0b0907;border:1px solid var(--c);color:var(--c);padding:2px 10px;display:flex;align-items:center;gap:4px;font-family:Cinzel,serif;font-size:13px;letter-spacing:.12em;white-space:nowrap}
.rib .pi{width:16px;height:16px}
.energie{position:absolute;right:20px;top:36px;width:228px;text-align:center}
.el{font-family:Cinzel,serif;font-size:13px;letter-spacing:.2em;opacity:.8}
.dia{display:flex;justify-content:center;gap:6px;margin:8px 0 14px}
.dia i{width:24px;height:24px;background:linear-gradient(135deg,#f4e1a0,#c8a24a);transform:rotate(45deg);border:1px solid #000}
.zug{width:228px;height:70px;background:#000;border:2px solid var(--paper);outline:1px solid var(--paper);outline-offset:3px;color:var(--paper);font-family:Cinzel,serif;font-weight:700;font-size:21px;letter-spacing:.1em;line-height:1.05}
.stapel{margin-top:12px;font-size:15px;opacity:.8}

/* Spielerbalken */
.hpbar{position:relative;height:26px;background:#1d0907;border:1px solid #000;box-shadow:0 0 0 1px #6a2a20}
.hpfill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#d4473a,#9e261c)}
.threat{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(-45deg,#ff8a7a 0 4px,#7a1a12 4px 8px);animation:puls 1.2s ease-in-out infinite}
@keyframes puls{50%{opacity:.55}}
.hpbar span{position:absolute;inset:0;text-align:center;font-family:Cinzel,serif;font-size:15px;line-height:26px;letter-spacing:.1em;color:#fff;text-shadow:0 1px 0 #000}
.pbar.A{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:10px}
.shield{position:relative;display:flex;align-items:center;justify-content:center;width:46px;height:46px}
.shield .pi{position:absolute;inset:0;width:46px;height:46px}
.shield b{position:relative;font-family:Cinzel,serif;font-weight:700;font-size:19px;color:#fff;text-shadow:0 1px 0 #000;margin-top:-6px}
.shield.big,.shield.big .pi{width:58px;height:58px}
.shield.big b{font-size:24px}

/* A: Kette */
.kette{position:absolute;left:22px;top:52px;width:250px;padding:14px;border:1px solid #2e2416;background:#070605}
.kl,.kl2{font-family:Cinzel,serif;font-size:12px;letter-spacing:.2em;opacity:.7}
.kl2{margin:8px 0 4px;letter-spacing:.1em}
.klast{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:22px}
.kr{display:flex;align-items:center;gap:8px;font-size:17px;margin-top:4px}
.kr b{font-family:Cinzel,serif;font-size:15px;letter-spacing:.06em}

/* B */
.radbox{position:absolute;left:0;top:6px;width:320px}
.radsvg{display:block}
.rlab{font-family:Cinzel,serif;font-size:14px;font-weight:700;letter-spacing:.04em}
.rmid{font-family:'IM Fell English';font-style:italic;font-size:13px;fill:#efe4c8;opacity:.8}
.radhint{position:absolute;left:24px;top:252px;font-size:12px;opacity:.55;display:none}
.ppanel{position:absolute;left:22px;bottom:290px;width:340px;padding:12px 16px;background:rgba(6,5,4,.85);border:1px solid #4a3b22}
.pn{font-family:Cinzel,serif;font-size:14px;letter-spacing:.2em;opacity:.8}
.pnum{font-family:Cinzel,serif;margin:2px 0 6px}.pnum b{font-size:40px}.pnum span{font-size:20px;opacity:.6}
.ppanel .hpbar{height:18px}
.prow{display:flex;align-items:center;gap:16px;margin-top:8px}
.inc{display:flex;align-items:center;gap:4px;font-size:17px}.inc b{font-family:Cinzel,serif;font-size:22px;color:#ff8a7a}

/* C */
.leiste-oben{position:absolute;left:0;top:0;width:1440px;height:58px;background:linear-gradient(rgba(0,0,0,.88),rgba(0,0,0,.6));border-bottom:1px solid #3a2c18;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.lo-l{font-family:Cinzel,serif;font-size:22px;letter-spacing:.08em}.lo-l small{font-family:'IM Fell English';font-style:italic;font-size:16px;letter-spacing:0;opacity:.75;margin-left:12px}
.lo-r{display:flex;gap:26px;font-size:17px}.lo-r span{display:flex;align-items:center;gap:6px}.lo-r b{font-family:Cinzel,serif;font-size:20px}
.lo-r span:first-child b{color:#e8c547;font-size:24px}
.schwelle{position:absolute;z-index:4;left:0;top:748px;width:1440px;height:58px;display:flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(rgba(0,0,0,0),#000 60%)}
.hpbar.C{height:30px}.hpbar.C span{line-height:30px;font-size:16px}
.incC{display:flex;align-items:center;gap:6px}.incC b{font-family:Cinzel,serif;font-size:26px;color:#ff8a7a}.incC em{font-size:15px;opacity:.75;color:#9fb4d8;font-style:normal}
.chain{position:absolute;left:18px;top:56px;width:270px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.chl{width:100%;font-family:Cinzel,serif;font-size:12px;letter-spacing:.2em;opacity:.7}
.tok{display:flex;align-items:center;justify-content:center;border:1px solid #3a2c18;background:#0c0a08}
.tok.old{width:44px;height:44px;opacity:.5}
.tok.last{width:60px;height:60px;border-color:#6d9be0}
.tok.next{flex-direction:column;align-items:flex-start;gap:6px;padding:8px;border-style:dashed;width:100%;margin-top:8px}
.opt{display:flex;align-items:center;gap:6px}.opt b{font-family:Cinzel,serif;font-size:14px}
.arr{font-size:26px;opacity:.6}
.band.C .rib{top:auto;bottom:-14px}.band.C .hand{top:46px}
.stage{overflow:hidden}
.notes p{font-size:17px;line-height:1.4}.notes h3{font-family:Cinzel,serif;font-size:16px;margin:16px 0 6px;opacity:.85}
nav .reset{margin-left:auto;border-style:dashed}
.scene{z-index:0}.scene.cover{width:1931px;height:1086px;left:-245px}
.mirror{position:absolute;left:0;top:810px;width:1440px;height:810px;transform:scaleY(-1);image-rendering:pixelated;filter:blur(1.5px) brightness(.55)}
.leiste-oben{z-index:5}
#foes{position:absolute;inset:0;z-index:2;pointer-events:none}
.foe{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.foe .fbar{width:120px;height:7px;border:1px solid #000;background:#2a0c09;box-shadow:0 0 0 1px rgba(90,42,32,.8)}
.foe .fbar div{height:100%;background:#c23a2e}
.fhp{font-family:'Press Start 2P',monospace;font-size:8px;color:#e7d3a8;text-shadow:1px 1px 0 #000}
.intent .pi{width:20px;height:20px}
/* Absicht v1: Pixel-Schild */
.v1 .intent{font-family:'Press Start 2P',monospace;font-size:14px;font-weight:400;color:#f3e6c6;background:#120e0a;border:2px solid #000;box-shadow:0 0 0 2px #6b5636,3px 3px 0 2px #000;padding:5px 7px 4px;gap:6px;text-shadow:none}
.v1 .intent b{font-weight:400}
/* Absicht v2: Messing-Raute */
.v2 .intent{position:relative;width:46px;height:46px;justify-content:center;font-size:0}
.v2 .intent::before{content:'';position:absolute;inset:6px;background:#0b0907;border:2px solid #c8a24a;transform:rotate(45deg);box-shadow:0 0 0 2px #000}
.v2 .intent .pi{position:absolute;left:-18px;top:13px;width:18px;height:18px}
.v2 .intent b{position:relative;font-family:Cinzel,serif;font-weight:700;font-size:17px;color:#f3e6c6}
.v2 .fhp{display:none}
/* Absicht v3: Pixelzahl mit Rand */
.v3 .intent{font-family:'Press Start 2P',monospace;font-size:18px;font-weight:400;color:#fff;gap:6px;text-shadow:2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000,2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000}
.v3 .intent b{font-weight:400}.v3 .fhp{display:none}

/* Band */
.band{position:absolute;left:0;top:810px;width:1440px;height:276px;z-index:1;border:0;background:none}
.v1 .band{background:linear-gradient(rgba(6,5,4,.55),rgba(0,0,0,.93) 55%,#000);border-top:1px solid #3a2c18}
.v2 .band{background:radial-gradient(ellipse at 50% 0%,rgba(90,62,30,.35),transparent 70%),repeating-linear-gradient(90deg,#120d09 0 3px,#0f0b07 3px 7px,#130e0a 7px 12px),#0e0a07;border-top:3px double #8a6e3a;box-shadow:0 -6px 18px rgba(0,0,0,.8)}
.v3 .band{top:560px;height:526px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.65) 45%,rgba(0,0,0,.92) 80%)}

/* Lebensbalken */
#pbar{position:absolute;z-index:4}
.v1 #pbar{left:310px;top:797px}
.v2 #pbar{left:26px;top:838px}
.v3 #pbar{left:400px;top:808px}
.pb{position:relative;height:24px}
.v2 .pb{height:16px}.v3 .pb{height:18px}
.track{position:absolute;left:0;top:0;bottom:0;background:#1d0907;box-shadow:0 0 0 2px #000,0 0 0 3px #6a2a20}
.seg{position:absolute;top:0;bottom:0;z-index:1;transition:all .35s}
.seg.red{background:linear-gradient(#d4473a,#9e261c)}
.seg.loss{background:repeating-linear-gradient(-45deg,#ff8a7a 0 4px,#7a1a12 4px 8px);animation:puls 1.2s ease-in-out infinite}
.seg.blue{background:linear-gradient(#a9c4ff,#3d63c9);box-shadow:0 0 0 2px #000,0 0 0 3px #3d63c9,0 0 14px #3d63c9}
.seg.bluehit{background:repeating-linear-gradient(-45deg,#e6efff 0 4px,#3d63c9 4px 8px);animation:puls 1.2s ease-in-out infinite;z-index:2}
.ptxt{position:absolute;left:0;top:0;bottom:0;z-index:3;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-size:14px;letter-spacing:.1em;color:#fff;text-shadow:0 1px 0 #000,0 0 3px #000}
.v2 .ptxt{font-size:12px}
.bshield{position:absolute;z-index:4;top:50%;transform:translate(-30%,-50%);width:36px;height:36px;display:flex;align-items:center;justify-content:center;transition:left .35s}
.bshield .pi{position:absolute;inset:0;width:36px;height:36px}
.bshield b{position:relative;font-family:Cinzel,serif;font-weight:700;font-size:15px;color:#fff;margin-top:-5px;text-shadow:0 1px 0 #000}
.pname{font-family:Cinzel,serif;font-size:12px;letter-spacing:.2em;opacity:.75;margin-top:6px}

/* Baum */
#treebox{position:absolute;z-index:3;left:10px;width:330px}
.v1 #treebox{top:842px}.v2 #treebox{top:868px}.v3 #treebox{top:850px}
.tl{font-family:Cinzel,serif;font-size:12px;letter-spacing:.2em;opacity:.6;margin-left:10px}
#tree{position:relative;width:330px;height:200px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 40px);mask-image:linear-gradient(90deg,transparent 0,#000 40px)}
.v2 #tree{height:186px}
#tsvg{position:absolute;left:0;top:0}
.tn{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border:2px solid var(--c);background:#0c0a08;display:flex;align-items:center;justify-content:center;transition:transform .45s cubic-bezier(.3,.8,.3,1),opacity .45s;z-index:2}
.tn.cur{width:40px;height:40px;left:-20px;top:-20px;box-shadow:0 0 0 2px #000,0 0 16px var(--c)}
.tn.cur .gly{width:30px!important;height:30px!important}
.aeste.neu{animation:fadein .5s .3s both}
@keyframes fadein{from{opacity:0;transform:translateX(-10px)}}
.plab{font-family:Cinzel,serif;font-size:11px;font-weight:700}
.blab{font-family:Cinzel,serif;font-size:12px;font-weight:700;letter-spacing:.03em}
#tmsg{position:absolute;left:10px;bottom:-8px;font-size:14px;opacity:0;transition:opacity .3s}
#tmsg.show{opacity:1}
.flash{font-family:Cinzel,serif;font-weight:700;font-size:18px;letter-spacing:.08em}
.sack{font-style:italic;color:#d98a7a}

/* Hand */
#hand{position:absolute;z-index:3;left:340px;right:250px;display:flex;justify-content:center;gap:10px}
.v1 #hand{top:852px}.v2 #hand{top:792px}.v3 #hand{top:850px}
.karte{cursor:pointer;transition:transform .15s}
.karte:hover{transform:translateY(-22px) rotate(0) scale(1.03);z-index:5}
.karte.teuer{filter:brightness(.6)}
.karte.nein{animation:nein .3s}
@keyframes nein{25%{transform:translateX(-6px) rotate(var(--r))}75%{transform:translateX(6px) rotate(var(--r))}}
.rib{top:auto;bottom:-15px;color:var(--c);border-color:var(--c)}
.rib.tri{background:#2a1f08;box-shadow:0 0 12px #e8c547}
.energie{z-index:3}
.v1 .energie,.v3 .energie{top:850px}.v2 .energie{top:840px}
.dia i.leer{background:#1a150e;border-color:#4a3b22}
.v3 #treebox,.v3 .energie{}
.karte{width:150px;height:208px}#hand{gap:8px;right:265px}
.v2 #pbar{top:830px}.v2 #treebox{top:878px}.v2 .tl{display:none}
.scenewrap{position:absolute;left:0;top:0;width:1440px;height:810px;overflow:hidden;z-index:0}
.scenewrap .scene{transform-origin:50% 60%;transition:transform .11s linear}
.schulter{position:absolute;left:0;top:0;width:1440px;height:810px;shape-rendering:crispEdges}
.camctl{position:absolute;z-index:6;right:24px;top:74px;display:flex;gap:6px;align-items:center;background:rgba(8,6,4,.85);border:1px solid #5a4626;padding:6px 10px;font-size:15px}
.camctl button{font-family:Cinzel,serif;font-size:13px;background:#0b0907;color:var(--paper);border:1px solid #4a3b22;padding:4px 10px;cursor:pointer}
.camctl button.on{border-color:var(--messing);background:#2a2114}
.camctl label{margin-left:8px;display:flex;gap:6px;align-items:center}
.lo-r span.g b{font-size:19px}.lo-r span.g .pi{width:17px;height:17px}
/* Gegner-Plakette */
.plak{position:absolute;z-index:2;transform:translateX(-50%);width:112px;display:grid;grid-template-rows:auto 13px;gap:4px;padding:5px 8px 7px;background:rgba(10,8,6,.88);border:1px solid #8a6e3a;box-shadow:0 0 0 1px #000,3px 4px 0 rgba(0,0,0,.7);pointer-events:none}
.plak::after{content:'';position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:rgba(10,8,6,.95);border-right:1px solid #8a6e3a;border-bottom:1px solid #8a6e3a;transform:translateX(-50%) rotate(45deg)}
.pk-a{display:flex;align-items:center;justify-content:center;gap:6px;font-family:Cinzel,serif;font-weight:700;font-size:21px;color:#f3e6c6;line-height:1}
.pk-a .pi{width:18px;height:18px}
.pk-bar{grid-row:2;grid-column:1;position:relative;background:#1d0907;box-shadow:0 0 0 1px #000,0 0 0 2px #6a2a20}
.pk-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#d4473a,#9e261c)}
.pk-n{grid-row:2;grid-column:1;position:relative;text-align:center;font-family:Cinzel,serif;font-size:11px;line-height:13px;color:#fff;text-shadow:0 1px 0 #000}
.pk-n span{opacity:.7}
#foes .foe{display:none}
/* Spieler links */
.v2 #pbar{left:24px;top:826px;width:296px}
.pkopf{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.pkopf span{font-family:Cinzel,serif;font-size:12px;letter-spacing:.22em;opacity:.75}
.pkopf b{font-family:Cinzel,serif;font-size:22px}.pkopf b span{font-size:14px;letter-spacing:0;opacity:.6}
.v2 .pb{height:16px}
.v2 #treebox{left:14px;top:884px;width:320px}
#tree{width:320px;height:190px}
.v2 #tree{height:190px}
.v2 #hand{left:344px}

.v2 #hand{top:800px}.karte{width:156px;height:216px}

ra fährt jetzt eine Strecke ab und bleibt an jedem Punkt 3,5 bis 4,5 Sekunden stehen: Mitte, links vorne, etwas zurück, rechts leicht vorne, zurück und etwas tiefer. Oben rechts steht, wo sie gerade ist.</li><li>Neu gerechnet: Was nah ist, verschiebt sich stark, was hinten ist, kaum. Der Fluchtpunkt am Ende des Gangs bleibt fast stehen.</li><li>Der Boden wird in Streifen verschoben, vorne mehr als hinten. Dadurch kippt die Perspektive mit, statt dass das ganze Bild wackelt.</li><li>Vor und zurück vergrößert nahe Ebenen stärker als ferne, wie eine echte Fahrt und nicht wie ein Zoom.</li><li>Die Plaketten wandern mit ihren Gegnern mit.</li></ul>"}};</script><script>const $=s=>document.querySelector(s);
const SW='<svg viewBox="0 0 9 9" class="pi"><path d="M7 1h1v1h-1zM6 2h1v1h-1zM5 3h1v1h-1zM4 4h1v1h-1zM3 5h1v1h-1zM1 5h1v1h-1zM2 6h1v1h-1zM1 7h1v1h-1z" fill="#e05a4a"/></svg>';
const SH='<svg viewBox="0 0 9 9" class="pi"><path d="M1 1h7v4h-1v1h-1v1h-1v1h-1v-1h-1v-1h-1v-1h-1z" fill="#8fb3ff"/><path d="M2 2h5v3h-1v1h-1v1h-1v-1h-1v-1h-1z" fill="#16244a"/></svg>';
const COIN='<svg viewBox="0 0 9 9" class="pi"><path d="M3 1h3v1h1v1h1v3h-1v1h-1v1h-3v-1h-1v-1h-1v-3h1v-1h1z" fill="#e8c547"/><path d="M4 3h1v3h-1z" fill="#8a6a1c"/></svg>';
const gly=(k,s)=>`<img class="gly" src="${D.gl[k]}" style="width:${s}px;height:${s}px" alt="${D.name[k]}">`;
const key=(a,b)=>[a,b].sort().join('');
const PAIR={};D.pairs.forEach(([k,n])=>PAIR[key(k[0],k[1])]=n);
const TRI={};D.triples.forEach(([k,n])=>TRI[k.split('').sort().join('')]=n);
function partners(s){const o=[];D.pairs.forEach(([k])=>{if(k.includes(s))o.push(k[0]===s?k[1]:k[0]);});return o;}
function reaction(prev2,prev,s){ // was löst s nach prev aus?
  if(!prev)return null;
  if(prev2&&new Set([prev2,prev,s]).size===3){const t=TRI[[prev2,prev,s].sort().join('')];if(t)return{n:t,tri:true};}
  if(prev===s)return{n:'Verstärkt',same:true};
  const p=PAIR[key(prev,s)];return p?{n:p}:null;}

const FOES0=[{x:470,y:445,n:'Salzläufer',a:'5×2',dmg:10,hp:31,mx:31},{x:935,y:372,n:'Salzläufer',a:'8',dmg:8,hp:24,mx:31}];
let S,V='2',L='staffel',camT=null;
function reset(){S={path:['S','W'],hand:D.hand.map((c,i)=>({...c,id:i})),en:2,blk:5,hp:52,mx:52,foes:(D.lay[L].foes||[]).map(f=>({...f})),flash:null};nodes=[];}
let nodes=[];

const NOTES=D.notes;
function setL(l){L=l;document.querySelectorAll('nav button[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===l));if(location.hash!=='#'+l)history.replaceState(null,'','#'+l);reset();build();}

function build(){
 const st=$('#stage');st.className='stage v'+V;
 const sc='<div class="scenewrap"><canvas id="cv" width="1440" height="810"></canvas></div><div class="camctl"><span>Kamera</span><button data-a="0">aus</button><button data-a="7">dezent</button><button data-a="13">deutlich</button><em id="camname"></em></div>';
 st.innerHTML=sc+`
 <div class="leiste-oben"><div class="lo-l">TIEFE XIV · ZUG 1 <small>Die Salzstollen</small></div>
 <div class="lo-r"><span class="g">${COIN}<b class="gold">37</b> Gold</span><span>Buch <b>0/16</b></span><span>Deck <b>12</b></span></div></div>
 <div id="foes"></div>
 <div class="band"></div>
 <div id="pbar"></div>
 <div id="treebox"><div class="tl">STOFFE</div><div id="tree"><svg id="tsvg" width="330" height="200"></svg></div><div id="tmsg"></div></div>
 <div id="hand"></div>
 <div class="energie"><div class="el">ENERGIE</div><div class="dia" id="dia"></div><button class="zug">ZUG<br>BEENDEN</button><div class="stapel">Stapel 4 · Ablage 1</div></div>`;
 $('#notes').innerHTML=NOTES[L];
 update(false);fit();cam();}


function update(anim=true){
 // Gegner
 $('#foes').innerHTML=S.foes.map(f=>{if(f.hp<=0)return'';
  return `<div class="plak" data-i="${f.i}" style="left:${f.x*3}px;top:${(f.y-f.kopf*f.s)*3-78}px"><div class="pk-a">${SW}<b>${f.a}</b></div><div class="pk-bar"><div class="pk-fill" style="width:${f.hp/f.mx*100}%"></div></div><div class="pk-n">${f.hp}<span>/${f.mx}</span></div></div>`;}).join('');
 // Balken
 const T=S.foes.filter(f=>f.hp>0).reduce((a,f)=>a+f.dmg,0);const ab=Math.min(S.blk,T),loss=Math.min(S.hp,T-ab);
 const TW=248;const scale=TW/S.mx;const px=v=>v*scale;const bw=Math.min(px(S.blk),48);const bk=S.blk?bw/S.blk:0;
 $('#pbar').innerHTML=`<div class="pkopf"><span>FISCHER</span><b>${S.hp}<span>/${S.mx}</span></b></div><div class="pb" style="width:${TW+48}px">
  <div class="track" style="width:${TW}px"></div>
  <div class="seg red" style="left:0;width:${px(S.hp-loss)}px"></div>
  <div class="seg loss" style="left:${px(S.hp-loss)}px;width:${px(loss)}px"></div>
  <div class="seg blue" style="left:${px(S.hp)}px;width:${bw}px"></div>
  <div class="seg bluehit" style="left:${px(S.hp)+bw-ab*bk}px;width:${ab*bk}px"></div>
  ${S.blk?`<div class="bshield" style="left:${px(S.hp)+bw}px">${SH}<b>${S.blk}</b></div>`:''}
 </div>`;
 // Energie
 $('#dia').innerHTML=[0,1,2].map(i=>`<i class="${i<S.en?'':'leer'}"></i>`).join('');
 // Hand
 const p=S.path,last=p[p.length-1],prev=p[p.length-2];
 $('#hand').innerHTML=S.hand.map((c,i,a)=>{const r=reaction(prev,last,c.s);const rot=(i-(a.length-1)/2)*2.2;const col=r&&r.tri?'#e8c547':D.col[c.s];
  return `<div class="karte${r?' rx':''}${c.c>S.en?' teuer':''}" data-id="${c.id}" style="--r:${rot}deg;--c:${col}">
  <div class="kost">${c.c}</div><div class="kst">${gly(c.s,20)}</div><div class="kn">${c.n.toUpperCase()}</div>
  <div class="bogen"><img src="${D.img[c.im]}"></div><div class="kt">${c.t}</div>
  ${r?`<div class="rib${r.tri?' tri':''}">${r.tri?'★ ':''}${r.n.toUpperCase()}</div>`:''}</div>`;}).join('');
 document.querySelectorAll('#hand .karte').forEach(el=>el.onclick=()=>play(+el.dataset.id,el));
 tree(anim);}

const SP=56,CX=96,CY=92;
function tree(anim){
 const box=$('#tree'),svg=$('#tsvg'),p=S.path,n=p.length,last=p[n-1],prev=p[n-2];
 // Pfadknoten (bleiben bestehen, damit sie gleiten)
 for(let i=0;i<n;i++){let el=nodes[i];
  if(!el){el=document.createElement('div');el.className='tn';el.innerHTML=gly(p[i],22);el.style.setProperty('--c',D.col[p[i]]);box.appendChild(el);nodes[i]=el;
   if(anim&&S.from){el.style.transition='none';el.style.transform=`translate(${S.from.x}px,${S.from.y}px)`;el.offsetWidth;el.style.transition='';}}
  const d=n-1-i;el.classList.toggle('cur',d===0);el.style.transform=`translate(${CX-d*SP}px,${CY}px)`;el.style.opacity=[1,.75,.45,.2][d]??0;}
 // Linien des Pfads
 let L='';for(let i=1;i<n;i++){const d=n-1-i;const r=reaction(p[i-2],p[i-1],p[i]);const x1=CX-(d+1)*SP,x2=CX-d*SP;const op=[1,.75,.45,.2][d]??0;
  L+=`<line x1="${x1+14}" y1="${CY}" x2="${x2-14}" y2="${CY}" stroke="${r?(r.tri?'#e8c547':D.col[p[i]]):'#4a3b22'}" stroke-width="${r?3:2}" opacity="${op}" ${r?'':'stroke-dasharray="3 4"'}/>`;
  if(r&&d<1)L+=`<text x="${(x1+x2)/2}" y="${CY-18}" text-anchor="middle" class="plab" fill="${r.tri?'#e8c547':D.col[p[i]]}" opacity="${op}">${r.n}</text>`;}
 // Äste
 const opts=[...new Set([...partners(last),last])];const hs=new Set(S.hand.map(c=>c.s));
 opts.sort((a,b)=>(hs.has(b)-hs.has(a)));
 const m=opts.length,gap=Math.min(40,170/Math.max(1,m-1)),bx=CX+80;let B='';
 opts.forEach((k,j)=>{const y=CY+(j-(m-1)/2)*gap;const r=reaction(prev,last,k);const av=hs.has(k);const c=r.tri?'#e8c547':D.col[k];
  B+=`<path d="M${CX+14} ${CY} C ${CX+50} ${CY}, ${bx-40} ${y}, ${bx-12} ${y}" fill="none" stroke="${c}" stroke-width="${av?2.5:1.5}" opacity="${av?.95:.3}" ${av?'':'stroke-dasharray="3 4"'}/>
  <circle cx="${bx}" cy="${y}" r="12" fill="#0c0a08" stroke="${c}" stroke-width="${av?2:1}" opacity="${av?1:.4}"/>
  <image href="${D.gl[k]}" x="${bx-8}" y="${y-8}" width="16" height="16" style="image-rendering:pixelated" opacity="${av?1:.3}"/>
  <text x="${bx+18}" y="${y+5}" class="blab" fill="${c}" opacity="${av?1:.35}">${r.tri?'★ ':''}${r.n}</text>`;});
 svg.innerHTML=L+`<g class="aeste${anim?' neu':''}">${B}</g>`;
 const any=opts.some(k=>hs.has(k));
 $('#tmsg').innerHTML=S.flash?`<span class="flash" style="color:${S.flash.c}">${S.flash.n}!</span>`:(any?'':'<span class="sack">Sackgasse: keine Karte auf der Hand reagiert</span>');
 $('#tmsg').classList.toggle('show',!!S.flash||!any);
 S.from=null;}

function play(id,el){const i=S.hand.findIndex(c=>c.id===id);const c=S.hand[i];
 if(c.c>S.en){el.classList.remove('nein');el.offsetWidth;el.classList.add('nein');return;}
 const p=S.path;const r=reaction(p[p.length-2],p[p.length-1],c.s);
 // Startpunkt des neuen Knotens = sein Ast
 const last=p[p.length-1];const opts=[...new Set([...partners(last),last])];const hs=new Set(S.hand.map(c=>c.s));opts.sort((a,b)=>(hs.has(b)-hs.has(a)));
 const j=opts.indexOf(c.s);const m=opts.length,gap=Math.min(40,170/Math.max(1,m-1));
 S.from=j>=0?{x:CX+80,y:CY+(j-(m-1)/2)*gap}:{x:CX+80,y:CY};
 S.en-=c.c;if(c.blk)S.blk+=c.blk;if(c.atk){const f=S.foes.find(f=>f.hp>0);if(f)f.hp=Math.max(0,f.hp-c.atk);}
 S.hand.splice(i,1);S.path.push(c.s);S.flash=r?{n:r.n,c:r.tri?'#e8c547':D.col[c.s]}:null;
 update(true);setTimeout(()=>{S.flash=null;$('#tmsg').classList.remove('show');tree(false);},1400);}


const IMG={L:D.R.L.map(l=>{const i=new Image();i.src=l.img;return i;}),F:D.R.foes.map(f=>f.fr.map(x=>{const i=new Image();i.src=x;return i;}))};
const VP={x:313,y:100};const par=y=>Math.max(0,Math.min(1.2,(y-VP.y)/170));
const LP=[0,.02,.15,.38,null,.58];
const SEQ=[{x:0,y:0,z:0,h:4,n:'Mitte'},{x:-1,y:.08,z:.22,h:4.5,n:'links vorne'},{x:-.45,y:-.05,z:-.08,h:3.5,n:'etwas zurück'},{x:.95,y:-.06,z:.12,h:4.5,n:'rechts, leicht vorne'},{x:.35,y:.12,z:-.16,h:4,n:'zurück, etwas tiefer'}];
let A=13,camC={x:0,y:0,z:0},seqI=0,seqT0=performance.now(),raf=null;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function camAt(now){const MOVE=2.6;const cur=SEQ[seqI],nxt=SEQ[(seqI+1)%SEQ.length];let t=(now-seqT0)/1000;
 if(t<cur.h){$('#camname')&&($('#camname').textContent=A?cur.n:'');return{x:cur.x,y:cur.y,z:cur.z};}
 const q=Math.min(1,(t-cur.h)/MOVE);if($('#camname'))$('#camname').textContent=A?'…':'';const e=ease(q);
 if(q>=1){seqI=(seqI+1)%SEQ.length;seqT0=now;}
 return{x:cur.x+(nxt.x-cur.x)*e,y:cur.y+(nxt.y-cur.y)*e,z:cur.z+(nxt.z-cur.z)*e};}
function proj(x,y,p,c){const s=1+c.z*p*1.25;return{x:VP.x+(x-VP.x)*s-c.x*A*p,y:VP.y+(y-VP.y)*s-c.y*A*p*.6,s};}
function draw(now){const cv=$('#cv');if(!cv){raf=null;return;}const g=cv.getContext('2d');g.imageSmoothingEnabled=false;
 const c=A?camAt(now):{x:0,y:0,z:0};g.setTransform(1,0,0,1,0,0);g.fillStyle='#000';g.fillRect(0,0,1440,810);
 const layer=(i,p,sy0,sy1)=>{const img=IMG.L[i];if(!img.complete)return;const s=1+c.z*p*1.25;const ox=-c.x*A*p,oy=-c.y*A*p*.6;
  g.setTransform(3*s,0,0,3*s,3*(VP.x*(1-s)+ox),3*(VP.y*(1-s)+oy));
  if(sy0==null)g.drawImage(img,-12,-12);else g.drawImage(img,0,sy0,504,sy1-sy0,-12,sy0-12,504,sy1-sy0);};
 layer(0,0);layer(1,.02);layer(2,.15);layer(3,.38);
 // Boden in Streifen: je tiefer im Bild, desto stärker die Verschiebung
 for(let y=0;y<294;y+=2){layer(4,par(y-12+1),y,y+2);}
 // Gegner nach Tiefe
 const fs=S.foes.map((f,i)=>({f,i})).filter(o=>o.f.hp>0).sort((a,b)=>a.f.y-b.f.y);const fi=Math.floor(now/125)%8;
 fs.forEach(({f})=>{const R=D.R.foes[f.k];const im=IMG.F[f.k][fi];const p=par(f.y);const P=proj(f.x,f.y,p,c);const sc=f.s*P.s;
  g.setTransform(3*sc*(f.flip?-1:1),0,0,3*sc,3*P.x,3*P.y);g.globalAlpha=f.alpha||1;if(im.complete)g.drawImage(im,-R.fx,-R.fy);g.globalAlpha=1;
  const el=document.querySelector('.plak[data-i="'+f.i+'"]');if(el){el.style.left=(P.x*3)+'px';el.style.top=((P.y-R.kopf*sc)*3-78)+'px';}});
 layer(5,.58);
 raf=requestAnimationFrame(draw);}
function cam(){document.querySelectorAll('.camctl button').forEach(b=>{b.classList.toggle('on',+b.dataset.a===A);b.onclick=()=>{A=+b.dataset.a;seqI=0;seqT0=performance.now();cam();};});
 if(!raf)raf=requestAnimationFrame(draw);}
function fit(){const w=$('.wrap').clientWidth;const s=Math.min(1,w/1440);$('#stage').style.transform='scale('+s+')';$('.wrap').style.height=(1086*s)+'px';}
addEventListener('resize',fit);
document.querySelectorAll('nav button[data-l]').forEach(b=>b.onclick=()=>setL(b.dataset.l));
$('nav .reset').onclick=()=>{reset();build();};
const h=location.hash.slice(1);setL(D.lay[h]?h:'staffel');
</script></body></html>
