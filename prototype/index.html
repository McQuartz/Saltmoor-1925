<html lang="de">
<head>

<div id="app">
 <div id="scenewrap">

   <div id="log"></div>

   <div id="foes"></div>
   <div id="hud"></div>
   <div id="toast"></div>
  </div>
 </div>

</div>

<div id="overlay"></div>

<div id="scare"><canvas id="scareC" width="80" height="60"></canvas></div>
